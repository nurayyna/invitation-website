  <body>
    <div id="root"></div>

    <!-- Static copy of the RSVP form so Netlify Forms can detect it at build
         time. The live form is rendered by src/components/sections/Rsvp.jsx;
         keep the field names in sync. -->
    <form name="rsvp" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="attending" />
      <input type="text" name="guests" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
